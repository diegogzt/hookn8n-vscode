<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Code Assistant</title>
    <link rel="stylesheet" href="../media/chatbot.css" />
  </head>
  <body>
    <div class="chat-container">
      <!-- Configuración del webhook -->
      <div class="webhook-config" id="webhookConfig">
        <div class="webhook-input-container">
          <label for="webhookInput" class="webhook-label">
            <span class="icon-primary">🔗</span> N8N Webhook:
          </label>
          <input
            type="url"
            id="webhookInput"
            class="webhook-input"
            placeholder="https://your-n8n.com/webhook/chatbot"
          />
        </div>
        <div class="webhook-controls">
          <button id="testButton" class="test-button">
            <span class="icon-margin">⚙️</span>Test Connection
          </button>
          <div id="webhookStatus" class="webhook-status disconnected">
            <span class="status-indicator"></span>
            Not configured
          </div>
          <button id="toggleConfig" class="toggle-config">
            <span class="icon-margin">❓</span>Help
          </button>
        </div>
        <div id="webhookHelp" class="webhook-help">
          <strong><span class="icon-primary">💡</span> How to configure:</strong
          ><br />
          1. Create an N8N webhook that receives POST<br />
          2. The webhook will receive: {"message": "text", "timestamp":
          "..."}<br />
          3. Can respond JSON: {"response": "response"} or plain text<br />
          4. Paste the URL here and click "Test Connection"
        </div>
      </div>

      <!-- Área de mensajes -->
      <main class="chat-messages" id="chatMessages">
        <!-- Los mensajes se agregarán dinámicamente aquí -->
      </main>

      <!-- Área de entrada -->
      <div class="input-area">
        <textarea
          id="messageInput"
          placeholder="Type your question here..."
          rows="1"
          maxlength="1000"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
        <button id="sendButton" title="Enviar mensaje (Enter)">
          <img src="../media/icons/send-icon.svg" alt="Enviar" />
        </button>
      </div>

      <!-- Información de entrada -->
      <div class="input-info">
        <span id="charCount">0/1000</span>
        <div class="action-buttons">
          <button class="action-button" onclick="clearChat()">
            <span class="icon-margin">🗑️</span>Clear
          </button>
          <button class="action-button" onclick="exportChat()">
            <span class="icon-margin">📥</span>Export
          </button>
        </div>
      </div>
    </div>

    <script>
      // Funciones adicionales
      function clearChat() {
        if (
          confirm("Are you sure you want to clear the entire conversation?")
        ) {
          const chatMessages = document.getElementById("chatMessages");
          chatMessages.innerHTML = "";
          // Reenviar mensaje de bienvenida
          setTimeout(() => {
            appendMessage(
              "bot",
              "Conversation cleared! I'm your AI Code Assistant. How can I help you now?",
              getCurrentTime()
            );
          }, 500);
        }
      }

      function exportChat() {
        const messages = document.querySelectorAll(".message");
        let chatText = "AI Code Assistant - Exported Conversation\n";
        chatText += "=".repeat(50) + "\n\n";

        messages.forEach((message) => {
          const isUser = message.classList.contains("user-message");
          const sender = isUser ? "User" : "AI Assistant";
          const text = message.querySelector(".message-text").textContent;
          const time = message.querySelector(".message-time").textContent;

          chatText += `[${time}] ${sender}: ${text}\n\n`;
        });

        // Descargar archivo
        const blob = new Blob([chatText], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `ai-assistant-conversation-${
          new Date().toISOString().split("T")[0]
        }.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      // Funciones auxiliares que el script principal necesita
      function getCurrentTime() {
        return new Date().toLocaleTimeString("es-ES", {
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function appendMessage(sender, text, timestamp) {
        // Esta función será definida en el script principal
        console.log("appendMessage called:", sender, text, timestamp);
      }
    </script>
    <script src="../media/chatbot.js"></script>
  </body>
</html>
